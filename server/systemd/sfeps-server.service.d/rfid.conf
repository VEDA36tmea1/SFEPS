[Unit]
Requires=sfeps-rfid.service
After=sfeps-rfid.service

[Service]
EnvironmentFile=-/etc/default/sfeps-rfid
Environment="SFEPS_RFID_SOCKET_PATH=/tmp/rc522_events.sock"
Environment="SFEPS_RFID_SOCKET_WAIT_SEC=10"
ExecStartPre=/bin/sh -c 'set -eu; timeout="${SFEPS_RFID_SOCKET_WAIT_SEC}"; while [ ! -S "${SFEPS_RFID_SOCKET_PATH}" ] && [ "${timeout}" -gt 0 ]; do sleep 1; timeout=$((timeout-1)); done; [ -S "${SFEPS_RFID_SOCKET_PATH}" ] || { echo "RFID socket missing before server start: ${SFEPS_RFID_SOCKET_PATH}" >&2; exit 1; }'
