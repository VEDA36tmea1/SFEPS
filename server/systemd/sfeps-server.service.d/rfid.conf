[Unit]
Requires=sfeps-rfid.service
After=sfeps-rfid.service

[Service]
EnvironmentFile=-/etc/default/sfeps-rfid
Environment="SFEPS_RFID_SOCKET_PATH=/tmp/rc522_events.sock"
Environment="SFEPS_RFID_SOCKET_WAIT_SEC=10"
ExecStartPre=/bin/sh -c 'set -eu; wait_raw="${SFEPS_RFID_SOCKET_WAIT_SEC:-10}"; wait_sec="$(echo "${wait_raw}" | tr -cd "0-9")"; [ -n "${wait_sec}" ] || wait_sec=10; while [ ! -S "${SFEPS_RFID_SOCKET_PATH}" ] && [ "${wait_sec}" -gt 0 ]; do sleep 1; wait_sec=$((wait_sec-1)); done; [ -S "${SFEPS_RFID_SOCKET_PATH}" ] || { echo "RFID socket missing before server start: ${SFEPS_RFID_SOCKET_PATH}" >&2; exit 1; }'
