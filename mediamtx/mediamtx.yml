###############################################
# 1. 글로벌 설정 (보안 및 프로토콜)
###############################################

# 프로토콜 설정 (녹화 안정성을 위해 TCP 강제 + 보안 RTSPS)
rtspTransports: [tcp]

# 암호화 설정 (optional: 일반/보안 둘 다 허용\strict: RTSPS)
rtspEncryption: "optional"

# RTSPS 포트 설정
rtspsAddress: ":8332"

# 인증서 경로 (사용자 계정 'iam' 확인 필수)
rtspServerKey: "/usr/local/etc/server.key"
rtspServerCert: "/usr/local/etc/server.crt"

###############################################
# 2. 경로(Path) 설정 (카메라 연결)
###############################################
paths:
  # [카메라 1] 설정
  cam1:
    # 소스: 실제 IP 카메라 주소
    # run_mediamtx.sh에서 SFEPS_MTX_CAM1_SOURCE로 덮어쓸 수 있습니다.
    source: rtsp://admin:CCgbdCCgbd@192.168.0.84/profile2/media.smp
    
    # 필요할 때만 카메라와 연결 (대역폭 절약)
    sourceOnDemand: yes
    
    # 라즈베리파이 자체 녹화 기능 끄기
    record: no

  # [기타] 나머지 경로에 대한 기본 설정 (들여쓰기 주의)
  all_others:
